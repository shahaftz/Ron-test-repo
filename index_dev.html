<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>DEV - הילד שגילה (מחדש) תופעה מוזרה</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }

    #dev-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #f9ca24; color: #1a1a2e;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 9999; font-size: 13px; font-weight: 700;
      direction: ltr;
    }
    #dev-bar span { background: #1a1a2e; color: #f9ca24; padding: 2px 8px; border-radius: 4px; }
    #dev-bar button {
      height: 28px; padding: 0 12px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #dev-bar button:hover { background: #333; }
    #dev-bar input[type=number] {
      width: 54px; height: 28px; border: none; border-radius: 4px;
      text-align: center; font-size: 14px; font-weight: 700;
    }
    #dev-label { margin-left: 6px; }

    #lomda-frame {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: calc(100% - 44px);
    }
  </style>
</head>
<body>

<div id="dev-bar">
  <span>DEV</span>
  <button type="button" onclick="nav(+1)" title="קדימה (RTL: שמאל = קדימה)">◀</button>
  <span id="dev-label">S ? / ?</span>
  <button type="button" onclick="nav(-1)" title="אחורה (RTL: ימין = אחורה)">▶</button>
  <input type="number" id="jump-input" min="1" value="1" aria-label="מספר מסך"
         onkeydown="if(event.key==='Enter')jumpTo()">
  <button type="button" onclick="jumpTo()">Go</button>
  <span style="margin-right:auto; font-size:11px; font-weight:400;">Ctrl+← קדימה &nbsp;|&nbsp; Ctrl+→ אחורה</span>
</div>

<iframe id="lomda-frame" src="index.html?dev=1" title="תצוגה מקדימה של הלומדה"></iframe>

<script src="registry.js"></script>
<script>
  const implemented = SCREEN_REGISTRY.filter(entry => entry.status === 'implemented');
  let curIndex = 0;

  const frame = document.getElementById('lomda-frame');
  const label = document.getElementById('dev-label');
  const input = document.getElementById('jump-input');

  input.max = SCREEN_REGISTRY.length;
  input.title = 'מסכים זמינים: ' + implemented.map(screenNumber).join(', ');

  window.addEventListener('message', event => {
    if (event.data && event.data.type === 'DEV_READY') {
      sendCurrent();
    }
  });

  function screenNumber(entry) {
    return Number(entry.id.replace('SC', ''));
  }

  function sendCurrent() {
    const entry = implemented[curIndex];
    if (!entry) {
      label.textContent = 'S — / ' + SCREEN_REGISTRY.length;
      return;
    }

    frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: entry.id }, '*');
    input.value = screenNumber(entry);
    input.setCustomValidity('');
    updateLabel();
  }

  function nav(delta) {
    if (!implemented.length) return;
    curIndex = Math.max(0, Math.min(implemented.length - 1, curIndex + delta));
    sendCurrent();
  }

  function jumpTo() {
    const requested = parseInt(input.value, 10);
    const nextIndex = implemented.findIndex(entry => screenNumber(entry) === requested);

    if (nextIndex === -1) {
      input.setCustomValidity('המסך עדיין לא ממומש');
      input.reportValidity();
      input.value = implemented[curIndex] ? screenNumber(implemented[curIndex]) : '';
      return;
    }

    curIndex = nextIndex;
    sendCurrent();
  }

  function updateLabel() {
    const entry = implemented[curIndex];
    label.textContent = entry
      ? 'S ' + screenNumber(entry) + ' / ' + SCREEN_REGISTRY.length
      : 'S — / ' + SCREEN_REGISTRY.length;
  }

  document.addEventListener('keydown', event => {
    if (event.ctrlKey && event.key === 'ArrowLeft') nav(+1);
    if (event.ctrlKey && event.key === 'ArrowRight') nav(-1);
  });

  updateLabel();
</script>
</body>
</html>
